name: Azure App Service Branch Test

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: "Branch to build and deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    environment: azure
    runs-on: ubuntu-latest
    env:
      WEB_APP_NAME: dailyconversation-test
      RESOURCE_GROUP: dailyconversation-test
      JAR_NAME: daily-conversation-0.0.1-SNAPSHOT.jar

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          mvn -B clean package -DskipTests
          test -f "target/$JAR_NAME"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service startup command
        shell: bash
        run: |
          set -euo pipefail
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --startup-file "java -jar /home/site/wwwroot/$JAR_NAME"

      - name: Deploy JAR to Azure App Service
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --src-path "target/$JAR_NAME" \
            --type jar

      - name: Show deployment
        shell: bash
        run: |
          set -euo pipefail
          az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --query "{host:defaultHostName,state:state,httpsOnly:httpsOnly}" \
            -o table
