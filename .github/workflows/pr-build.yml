name: Azure Container Branch Test

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: "Branch to build and push"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    environment: azure
    runs-on: ubuntu-latest
    env:
      ACR_NAME: dailyconversationacr123
      ACR_LOGIN_SERVER: dailyconversationacr123-d4d3eghqfab6hhbd.azurecr.io
      IMAGE_NAME: dailyconversation

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build application
        run: mvn -B clean package -DskipTests

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR access token
        id: acr-token
        shell: bash
        run: |
          set -euo pipefail
          token=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.token }}

      - name: Build Docker image
        run: |
          docker build             -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"             -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"             .

      - name: Push Docker image
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      - name: Show image
        run: |
          echo "Pushed:"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"
