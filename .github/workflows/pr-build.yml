name: Azure Branch Test

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to build and deploy'
        required: true
        type: string


permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_HOST: 40.80.90.85
      AZURE_USER: azureUser
      PR_DIR: C:/Users/azureUser/DailyConversation-pr

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dailyconversation_actions
          chmod 600 ~/.ssh/dailyconversation_actions
          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts

      - name: Prepare Azure test directory
        run: |
          set -e
          ssh -T -i ~/.ssh/dailyconversation_actions "$AZURE_USER@$AZURE_HOST"             "powershell -NoProfile -Command \"New-Item -ItemType Directory -Force -Path '$PR_DIR' | Out-Null; New-Item -ItemType Directory -Force -Path '$PR_DIR/data' | Out-Null\""

      - name: Upload application
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/daily-conversation-0.0.1-SNAPSHOT.jar"
          REMOTE_JAR='C:\Users\azureUser\DailyConversation-pr\daily-conversation.jar'

          test -f "$JAR"
          local_size=$(stat -c%s "$JAR")
          echo "Local JAR size: $local_size bytes"
          test "$local_size" -gt 0

          # Stream base64 over SSH instead of embedding the complete JAR in
          # the remote command. This avoids Windows OpenSSH command-size/path
          # issues and prevents accidental 0-byte uploads.
          base64 "$JAR" |
            ssh -T -i ~/.ssh/dailyconversation_actions "$AZURE_USER@$AZURE_HOST" \
              "powershell -NoProfile -ExecutionPolicy Bypass -Command \
                \"\$b64 = [Console]::In.ReadToEnd(); \
                if ([string]::IsNullOrWhiteSpace(\$b64)) { throw 'No JAR data received over SSH' }; \
                \$bytes = [Convert]::FromBase64String(\$b64); \
                [IO.File]::WriteAllBytes('$REMOTE_JAR', \$bytes); \
                \$size = (Get-Item -LiteralPath '$REMOTE_JAR').Length; \
                if (\$size -le 0) { throw 'Uploaded JAR is 0 bytes' }; \
                Write-Host ('JAR uploaded successfully: ' + \$size + ' bytes')\""
      - name: Verify uploaded JAR
        shell: bash
        run: |
          set -e
          ssh -T -i ~/.ssh/dailyconversation_actions \
            "$AZURE_USER@$AZURE_HOST" \
            "powershell -NoProfile -Command \"if (-not (Test-Path -LiteralPath 'C:\\Users\\azureUser\\DailyConversation-pr\\daily-conversation.jar')) { throw 'JAR upload failed' }; Write-Host ('JAR size: ' + (Get-Item -LiteralPath 'C:\\Users\\azureUser\\DailyConversation-pr\\daily-conversation.jar').Length + ' bytes')\""

      - name: Deploy and health check
        run: |
          set -e
          cat > deploy.ps1 <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $dir = 'C:/Users/azureUser/DailyConversation-pr'
          $jar = Join-Path $dir 'daily-conversation.jar'
          $log = Join-Path $dir 'app.log'
          $errorLog = Join-Path $dir 'app-error.log'
          $dbDir = Join-Path $dir 'data'
          $dbPath = Join-Path $dbDir 'daily-conversation.db'

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          New-Item -ItemType Directory -Force -Path $dbDir | Out-Null

          $pids = Get-NetTCPConnection -State Listen -LocalPort 8081 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique
          if ($pids) {
            foreach ($pid in $pids) {
              Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 2
          }

          $env:PORT = '8081'
          $env:DB_PATH = $dbPath

          $adminUsername = [Environment]::GetEnvironmentVariable('ADMIN_USERNAME', 'Machine')
          $adminPassword = [Environment]::GetEnvironmentVariable('ADMIN_PASSWORD', 'Machine')
          if ([string]::IsNullOrWhiteSpace($adminUsername)) {
            $adminUsername = 'admin'
          }
          if ([string]::IsNullOrWhiteSpace($adminPassword)) {
            throw 'ADMIN_PASSWORD is not configured as a Machine-level environment variable on the Azure VM.'
          }

          $env:ADMIN_USERNAME = $adminUsername
          $env:ADMIN_PASSWORD = $adminPassword

          $process = Start-Process -FilePath 'java' -ArgumentList '-jar', $jar -WorkingDirectory $dir -RedirectStandardOutput $log -RedirectStandardError $errorLog -WindowStyle Hidden -PassThru
          Write-Host "Started branch test app with PID $($process.Id)"

          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8081/' -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                $healthy = $true
                break
              }
            } catch {
            }
          }

          if (-not $healthy) {
            Write-Host 'Health check failed.'
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            if (Test-Path $errorLog) { Get-Content $errorLog -Tail 100 }
            exit 1
          }

          Write-Host 'Branch test application is healthy on port 8081.'
          POWERSHELL

          encoded=$(iconv -f UTF-8 -t UTF-16LE deploy.ps1 | base64 -w 0)
          ssh -T -i ~/.ssh/dailyconversation_actions "$AZURE_USER@$AZURE_HOST" "powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $encoded"

      - name: Test URL
        run: echo "Branch test environment deployed at http://$AZURE_HOST:8081"
