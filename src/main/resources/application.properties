spring.application.name=daily-conversation
server.port=${PORT:8080}
spring.datasource.url=jdbc:sqlite:${DB_PATH:data/daily-conversation.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false

# Keep this key on the server. The app falls back to a local analysis when it is absent.
google.ai.api-key=
google.ai.model=${GOOGLE_AI_MODEL:gemini-2.5-flash}
google.ai.base-url=${GOOGLE_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Single-user auth — set ADMIN_PASSWORD in Azure App Service > Configuration > Application settings
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:test123}
